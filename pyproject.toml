[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtgscrap"
version = "0.2.0"
description = "MTG hate-card reports per archetype via the Videre API"
requires-python = ">=3.12"
dependencies = [
    "requests~=2.31.0",
    "weasyprint>=59",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mtgscrap*"]
